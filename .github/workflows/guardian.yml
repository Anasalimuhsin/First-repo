name: guardian

on:
  push:
    paths: ['guardian/**', '.github/workflows/guardian.yml']
  pull_request:
    paths: ['guardian/**', '.github/workflows/guardian.yml']

permissions:
  contents: read

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: guardian/backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: guardian_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/guardian_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: guardian/backend/package-lock.json }
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: API tests (PostgreSQL)
        run: npm run test:api
      - name: Detection regression gate (synthetic set)
        run: npm run eval -- --min-self-harm-recall 0.95

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: guardian/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: guardian/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: 1 }

  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: guardian }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/guardian
      DATABASE_SSL: 'false'
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Start API
        working-directory: guardian/backend
        run: |
          npm ci
          npm run db:migrate
          GUARDIAN_DATA_KEYS="k1:$(openssl rand -base64 32)" nohup node src/server.js > api.log 2>&1 &
      - name: Build and start dashboard
        working-directory: guardian/web
        run: |
          npm ci
          npm run build
          API_URL=http://localhost:3000 nohup npx next start -p 3001 > web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 30); do curl -sf localhost:3000/healthz && curl -sf -o /dev/null localhost:3001/login && break; sleep 1; done
      - name: Smoke test
        working-directory: guardian/web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            guardian/web/e2e/screenshots
            guardian/backend/api.log
            guardian/web/web.log

  docker:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t guardian-backend guardian/backend
      - run: docker build -t guardian-web --build-arg NEXT_PUBLIC_API_PUBLIC_URL=https://api.example.com guardian/web
